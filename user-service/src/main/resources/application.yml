server:
  port: 0

spring:
  application:
    name: user-service
  zipkin:
    base-url: http://127.0.0.1:9411
    enabled: true
  sleuth:
    sampler:
      probability: 1.0
#  config:
#    import: "optional:configserver:http://localhost:8888"
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
  security:
    user:
      name: user
      password: $2a$10$SE2LM01xn1R8oh5AkFJMtO0mmxLczOIZ8dmIFhOwtXLyNNB1MljlG
#  cloud:
#    config:
#      uri: http://127.0.0.1:8888
#      name: ecommerce
#  profiles:
#    active: dev
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    stream:
      username: guest
      password: guest

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
    fetch-registry: true
    register-with-eureka: true

greeting:
  message: Welcome to the Simple E-commerce (spring boot)

management:
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health
          - beans
          - info
          - httptrace
          - busrefresh

logging:
  level:
    org.example.userservice.client: DEBUG
    org.springframework.security: DEBUG